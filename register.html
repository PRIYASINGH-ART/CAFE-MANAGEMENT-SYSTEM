<!DOCTYPE html>
<html lang="en ">
<head>
    <title>Register - Beans & Brew</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
    <div class="register-box">
        <h1>Join the Brew</h1>
        <p style="color:#d4a373;margin-bottom:20px;">create your account</p>
        <input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email Address">

<div class="password-container">
    <input type="password" id="password" placeholder="Password">
    <span class="toggle-password" onclick="togglePassword()">👁</span>
</div>

<select id="role">
    <option value=" "disabled selected>Select Role</option>
    <option value="staff">Cafe Staff</option>
    <option value="customer">Customer</option>
</select>

<button class="btn" onclick="register()">Register Now</button>
<div style="margin-top:20px;">
    <a href="login.html">
    <button style="border-radius:25px; color:#d06e0c;background:white; border:1px solid #d4a373; padding:8px 20px; cursor :pointer; font-weight:bold;"> back to login</button>
    </a>
</div>
    </div>
  <script src="script.js"> </script>
</body>
</html>
